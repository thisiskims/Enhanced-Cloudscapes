name: Build macOS Plugin

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake glew glm libpng

      - name: Download X-Plane SDK
        run: |
          curl -sLo XPSDK.zip https://developer.x-plane.com/wp-content/plugins/code-sample-generation/sdk_zip_files/XPSDK301.zip
          unzip -q XPSDK.zip -d xpsdk

      - name: Configure CMake
        run: |
          SDK_DIR="$GITHUB_WORKSPACE/xpsdk/SDK"
          cmake -B build             -DCMAKE_BUILD_TYPE=Release             -DXPLM_SDK_INCLUDE_DIRECTORY="$SDK_DIR/CHeaders/XPLM"             -DXPLM_SDK_LIBRARY_FILE="$SDK_DIR/Libraries/Mac/XPLM.framework"             -DGLEW_INCLUDE_DIRECTORY=$(brew --prefix glew)/include             -DGLEW_LIBRARY_FILE=$(brew --prefix glew)/lib/libGLEW.dylib             -DGLM_INCLUDE_DIRECTORY=$(brew --prefix glm)/include             -DLIBPNG_INCLUDE_DIRECTORY=$(brew --prefix libpng)/include             -DLIBPNG_LIBRARY_FILE=$(brew --prefix libpng)/lib/libpng.dylib

      - name: Build
        run: |
          cmake --build build --config Release --verbose

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Enhanced-Cloudscapes-macOS
          path: |
            build/*.xpl
            build/*.framework
            build/*.dylib
